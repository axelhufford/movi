<!DOCTYPE html>
<!-- Source for /og-image.png (1200x630). Render with brand/render.sh. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Instrument+Sans:wght@600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #F5EFE4; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #1C1A17; font-family: 'Instrument Sans', sans-serif;
  }
  .strip { display: flex; align-items: center; }
  .frame {
    position: relative; width: 62px; height: 78px;
    border: 2.5px solid rgba(28,26,23,0.22);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; color: #A0978A;
  }
  .frame.active {
    width: 74px; height: 94px; margin: 0 -3px; z-index: 1;
    border: 3.5px solid #C8361F; background: #FFFBF3;
    font-weight: 800; font-size: 40px; color: #C8361F;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; left: 50%; width: 16px; height: 5px;
    margin-left: -8px; border-radius: 1px; background: rgba(28,26,23,0.12);
  }
  .frame::before { top: 5px; }
  .frame::after { bottom: 5px; }
  .frame.active::before, .frame.active::after { background: rgba(200,54,31,0.35); }
  .wordmark {
    margin-top: 26px; font-family: 'Fraunces', serif; font-weight: 800;
    font-size: 136px; line-height: 1; letter-spacing: -4.5px;
  }
  .tagline {
    margin-top: 18px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: 36px; color: #6A635A;
  }
  .url {
    margin-top: 46px; display: flex; align-items: center; gap: 20px;
    font-weight: 600; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; color: #B8321F;
  }
  .url::before, .url::after { content: ""; width: 56px; height: 1.5px; background: rgba(28,26,23,0.2); }
</style>
</head>
<body>
  <div class="strip">
    <div class="frame">3</div>
    <div class="frame active">1</div>
    <div class="frame">2</div>
  </div>
  <div class="wordmark">Movi</div>
  <div class="tagline">Every movie ranked, one matchup at a time.</div>
  <div class="url">movirank.com</div>
</body>
</html>
