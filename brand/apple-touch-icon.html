<!DOCTYPE html>
<!-- Source for /apple-touch-icon.png (180x180). Render with brand/render.sh.
     Same mark as the favicon in index.html: three film frames, middle one lit. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 180px; height: 180px; overflow: hidden; background: #C8361F; }
  body { display: flex; align-items: center; justify-content: center; }
  .strip { display: flex; align-items: center; margin-top: 4px; }
  .frame {
    width: 34px; height: 42px; border: 5px solid rgba(255,251,243,0.45); border-radius: 4px;
  }
  .frame.active {
    width: 42px; height: 52px; margin: 0 7px; border-color: #FFFBF3;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 800; font-size: 28px; line-height: 1; color: #FFFBF3;
  }
</style>
</head>
<body>
  <div class="strip">
    <div class="frame"></div>
    <div class="frame active">1</div>
    <div class="frame"></div>
  </div>
</body>
</html>
