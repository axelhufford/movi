  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Theme tokens ──────────────────────────────────────────────
       Matinee: warm paper + ink with a tomato accent (movies) and sage paper
       with a bottle-green accent (TV). Light is the default; .night-mode is
       the dark variant. Tokens never reference other tokens: a var() inside a
       custom property resolves where it is declared, so a theme class lower
       in the tree could not re-point it. */
    :root {
      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 14px;

      --bg: #F5EFE4;
      --surface: #FFFBF3;
      --surface2: #EBE3D4;
      --text: #1C1A17;
      --text-muted: #6A635A;
      --text-dim: #6A635A;
      --text-faint: #A0978A;
      --accent: #C8361F;
      --accent-hover: #A82C18;
      --accent-soft: rgba(200,54,31,0.10);
      --accent-text: #B8321F;
      --border: rgba(28,26,23,0.12);
      --border-strong: rgba(28,26,23,0.20);
      --border-accent: rgba(200,54,31,0.35);
      --gold: #8A6400;
      --gold-foil: linear-gradient(110deg, #8A6400 0%, #C9962B 45%, #8A6400 55%, #6B4E00 100%);
      --score-high: #2F6B45;
      --score-mid: #8A6400;
      --score-low: #6A635A;
      --success: #2F6B45;
      --tint: rgba(28,26,23,0.04);
      --scrim: rgba(28,26,23,0.42);
      --shimmer: rgba(28,26,23,0.05);
      --sprocket: rgba(28,26,23,0.18);
      --shadow-sm: 0 1px 2px rgba(60,40,20,0.08);
      --shadow-md: 0 1px 2px rgba(60,40,20,0.06), 0 6px 16px -8px rgba(60,40,20,0.28);
      --shadow-lg: 0 2px 6px rgba(60,40,20,0.08), 0 24px 48px -20px rgba(60,40,20,0.38);
      --shadow-lift: 0 0 0 1px rgba(200,54,31,0.35), 0 8px 20px -10px rgba(60,40,20,0.35);
    }
    .tv-mode {
      --bg: #EEF0E5;
      --surface: #F8F9F2;
      --surface2: #E2E6D8;
      --text: #1A1D19;
      --text-muted: #5F665C;
      --text-dim: #5F665C;
      --text-faint: #9AA095;
      --accent: #1F6B4E;
      --accent-hover: #15503A;
      --accent-soft: rgba(31,107,78,0.10);
      --accent-text: #1F6B4E;
      --border: rgba(26,29,25,0.12);
      --border-strong: rgba(26,29,25,0.20);
      --border-accent: rgba(31,107,78,0.35);
      /* Ink, not green, so high scores don't read as the TV accent */
      --score-high: #1A1D19;
      --score-low: #5F665C;
      --tint: rgba(26,29,25,0.04);
      --scrim: rgba(20,30,24,0.42);
      --shimmer: rgba(26,29,25,0.05);
      --sprocket: rgba(26,29,25,0.18);
      --shadow-sm: 0 1px 2px rgba(30,45,35,0.08);
      --shadow-md: 0 1px 2px rgba(30,45,35,0.06), 0 6px 16px -8px rgba(30,45,35,0.28);
      --shadow-lg: 0 2px 6px rgba(30,45,35,0.08), 0 24px 48px -20px rgba(30,45,35,0.38);
      --shadow-lift: 0 0 0 1px rgba(31,107,78,0.35), 0 8px 20px -10px rgba(30,45,35,0.35);
    }
    .night-mode {
      --bg: #0F0E0D;
      --surface: #1C1A18;
      --surface2: #262320;
      --text: #F5EFE4;
      --text-muted: #A39A8C;
      --text-dim: #A39A8C;
      --text-faint: #6A635A;
      --accent: #E0492F;
      --accent-hover: #EC5E44;
      --accent-soft: rgba(224,73,47,0.14);
      --accent-text: #F0725A;
      --border: rgba(245,239,228,0.09);
      --border-strong: rgba(245,239,228,0.16);
      --border-accent: rgba(224,73,47,0.40);
      --gold: #E0B84A;
      --gold-foil: linear-gradient(110deg, #f5c518 0%, #fff1a8 45%, #f5c518 55%, #c99a00 100%);
      --score-high: #5FB77A;
      --score-mid: #E0B84A;
      --score-low: #A39A8C;
      --success: #5FB77A;
      --tint: rgba(255,255,255,0.04);
      --scrim: rgba(8,6,4,0.68);
      --shimmer: rgba(255,255,255,0.06);
      --sprocket: rgba(0,0,0,0.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
      --shadow-md: 0 4px 16px -4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-lg: 0 18px 48px -12px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.3);
      --shadow-lift: 0 0 0 1px rgba(224,73,47,0.40), 0 12px 28px -12px rgba(0,0,0,0.6);
    }
    .night-mode.tv-mode {
      --bg: #0D120F;
      --surface: #151C18;
      --surface2: #1E2722;
      --text: #EEF0E5;
      --text-muted: #9AA095;
      --text-dim: #9AA095;
      --text-faint: #5F665C;
      --accent: #2A8A64;
      --accent-hover: #34A077;
      --accent-soft: rgba(42,138,100,0.16);
      --accent-text: #5CC196;
      --border: rgba(238,240,229,0.09);
      --border-strong: rgba(238,240,229,0.16);
      --border-accent: rgba(42,138,100,0.40);
      --score-high: #EEF0E5;
      --score-low: #9AA095;
      --shadow-lift: 0 0 0 1px rgba(42,138,100,0.40), 0 12px 28px -12px rgba(0,0,0,0.6);
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body:has(.tv-mode) { background-color: #EEF0E5; }
    body:has(.night-mode) { background-color: #0F0E0D; }
    body:has(.night-mode.tv-mode) { background-color: #0D120F; }
    button, input, textarea, select { font-family: inherit; }
    .app-theme { color: var(--text); }

    #root { max-width: 900px; margin: 0 auto; padding: 20px; }

    /* Film Strip Logo */
    .header { text-align: center; padding: 36px 0 20px; position: relative; }
    .header h1 { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; cursor: pointer; display: none; }
    .header h1 span { color: var(--accent); }
    .header p {
      color: var(--text-muted); margin-top: 10px;
      font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 1.05rem;
    }

    .logo-strip { display: flex; align-items: center; justify-content: center; gap: 0; cursor: pointer; }
    .logo-frame {
      display: flex; align-items: center; justify-content: center; position: relative;
      width: 34px; height: 42px; border: 1.5px solid var(--border-strong);
      background: transparent;
    }
    .logo-frame.active {
      border: 2px solid var(--accent); background: var(--surface);
      transform: scale(1.14); z-index: 2;
    }
    .logo-frame .frame-num {
      font-family: var(--font-display); font-weight: 600; font-size: 17px;
      color: var(--text-faint);
    }
    .logo-frame.active .frame-num { color: var(--accent); font-weight: 800; }
    .logo-frame .sprocket {
      position: absolute; left: 50%; transform: translateX(-50%);
      width: 9px; height: 3px; border-radius: 1px; background: var(--border);
    }
    .logo-frame.active .sprocket { background: var(--border-accent); }
    .sprocket-top { top: 3px; }
    .sprocket-bot { bottom: 3px; }
    .logo-wordmark {
      font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1;
      letter-spacing: -1.5px; color: var(--text); margin-top: 14px;
    }
    .logo-tv-sub {
      font-family: var(--font-body); font-weight: 700; font-size: 11px;
      letter-spacing: 4px; text-transform: uppercase; color: var(--accent-text);
      margin-top: 6px; display: none;
    }
    .tv-mode .logo-tv-sub { display: block; }
    /* TV frames get rounded corners, like little screens */
    .tv-mode .logo-frame { border-radius: 7px; }
    .tv-mode .logo-frame.active { border-radius: 8px; }

    /* Auth Bar */
    .auth-bar {
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 10px 0; margin-bottom: 4px;
    }
    .auth-user {
      display: flex; align-items: center; gap: 8px;
    }
    .auth-avatar {
      width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--accent);
    }
    .auth-avatar-placeholder {
      width: 32px; height: 32px; border-radius: 50%; background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: var(--accent);
      border: 2px solid var(--accent);
    }
    .auth-name { font-size: 0.85rem; font-weight: 600; }
    .auth-btn {
      padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
      font-family: var(--font-body);
    }
    .auth-btn-signin {
      background: var(--accent); color: #fff;
    }
    .auth-btn-signin:hover { background: var(--accent-hover); }
    .auth-btn-signout {
      background: var(--surface2); color: var(--text-muted); font-size: 0.75rem; padding: 6px 12px;
    }
    .auth-btn-signout:hover { background: var(--border-strong); color: var(--text); }
    .auth-btn-email {
      background: var(--surface2); color: var(--text);
    }
    .auth-btn-email:hover { background: var(--border-strong); }
    .auth-divider {
      display: flex; align-items: center; gap: 12px; margin: 10px 0;
      color: var(--text-muted); font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border-strong);
    }
    .auth-form {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px;
      margin-bottom: 16px; max-width: 360px; margin-left: auto; margin-right: auto;
    }
    .auth-form h3 { text-align: center; margin-bottom: 16px; font-size: 1.1rem; font-family: var(--font-display); }
    .auth-input {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.9rem; margin-bottom: 10px;
      outline: none; transition: border-color 0.2s; font-family: var(--font-body);
    }
    .auth-input:focus { border-color: var(--accent); }
    .auth-input::placeholder { color: var(--text-faint); }
    .auth-error {
      color: var(--accent); font-size: 0.8rem; margin-bottom: 10px; text-align: center;
    }
    .auth-link {
      color: var(--accent); cursor: pointer; font-size: 0.8rem;
      background: none; border: none; text-decoration: underline;
    }
    .auth-link:hover { color: var(--accent-hover); }
    .auth-form-footer {
      text-align: center; margin-top: 12px; font-size: 0.8rem; color: var(--text-muted);
    }
    .auth-form-submit {
      width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.9rem; background: var(--accent); color: #fff;
      transition: background 0.2s; margin-top: 4px;
    }
    .auth-form-submit:hover { background: var(--accent-hover); }
    .auth-back {
      display: block; text-align: center; margin-bottom: 12px;
      color: var(--text-muted); font-size: 0.8rem; cursor: pointer;
      background: none; border: none;
    }
    .auth-back:hover { color: var(--text); }
    .auth-sync {
      font-size: 0.7rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px;
    }
    .auth-sync-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #4caf50; display: inline-block;
    }

    /* Share */
    .share-btn {
      padding: 6px 14px; background: none; border: 1px solid var(--border-strong);
      color: var(--text-muted); border-radius: 8px; cursor: pointer;
      font-size: 0.8rem; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .share-btn:hover { border-color: var(--accent); color: var(--accent); }
    .private-toggle {
      padding: 6px 14px; background: none; border: 1px solid var(--border-strong);
      color: var(--text-muted); border-radius: 8px; cursor: pointer;
      font-size: 0.8rem; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .private-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .private-toggle.active { border-color: var(--gold); color: var(--gold); }

    /* Profile View (viewing someone else's rankings) */
    .profile-banner {
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px;
      text-align: center; margin-bottom: 20px;
    }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--accent); margin-bottom: 10px;
    }
    .profile-avatar-ph {
      width: 64px; height: 64px; border-radius: 50%; background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 700; color: var(--accent);
      border: 3px solid var(--accent); margin: 0 auto 10px;
    }
    .profile-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .profile-count { color: var(--text-muted); font-size: 0.9rem; }
    .profile-back {
      display: inline-block; margin-top: 12px; padding: 8px 20px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
    }
    .profile-back:hover { background: var(--accent-hover); }

    /* Tabs for navigation */
    .nav-tabs {
      display: flex; gap: 0; margin-bottom: 20px; overflow-x: auto; overflow-y: hidden;
      box-shadow: inset 0 -1px 0 var(--border-strong);
    }
    .nav-tab {
      flex: 1; padding: 12px 16px; border: none; background: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
      white-space: nowrap; text-align: center;
      font-family: var(--font-body);
    }
    .nav-tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
    .nav-tab:not(.active):hover { color: var(--text); border-bottom-color: var(--border-strong); }

    /* Community */
    .community-section { margin-top: 10px; }
    .community-empty {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
      border: 2px dashed var(--border-strong); border-radius: var(--radius);
    }
    .community-list { display: flex; flex-direction: column; gap: 8px; }
    .community-card {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .community-card:hover { background: var(--surface2); transform: translateY(-2px); }
    .community-card-avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--accent); flex-shrink: 0;
    }
    .community-card-avatar-ph {
      width: 44px; height: 44px; border-radius: 50%; background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; color: var(--accent);
      border: 2px solid var(--accent); flex-shrink: 0;
    }
    .community-card-info { flex: 1; min-width: 0; }
    .community-card-name { font-family: var(--font-body); font-weight: 600; font-size: 0.95rem; }
    .community-card-meta { color: var(--text-muted); font-size: 0.8rem; }
    .community-card-top {
      display: flex; gap: 4px; margin-top: 6px;
    }
    .community-card-top img, .community-card-top .poster-placeholder {
      width: 28px; height: 42px; border-radius: 4px; object-fit: cover;
    }
    .community-card-arrow { color: var(--text-muted); font-size: 1.2rem; flex-shrink: 0; }
    .compatibility-badge {
      font-size: 0.7rem; font-weight: 700; padding: 4px 8px;
      border-radius: 12px; flex-shrink: 0; text-align: center;
      min-width: 36px; line-height: 1;
    }
    .compatibility-high { background: var(--accent); color: #fff; }
    .compatibility-mid { background: var(--gold); color: #fff; }
    .compatibility-low { background: var(--surface2); color: var(--text-muted); font-weight: 600; }
    .compatibility-badge { cursor: pointer; }
    .compatibility-badge:active { transform: scale(0.95); }
    .compat-explainer {
      background: var(--surface); border: 1px solid var(--accent); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 12px; font-size: 0.8rem;
      color: var(--text); line-height: 1.5; position: relative;
      animation: fadeInUp 0.2s;
    }
    .compat-explainer-close {
      position: absolute; top: 6px; right: 10px; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 1rem;
    }
    .community-delete-btn {
      background: none; border: none; font-size: 1rem; cursor: pointer;
      opacity: 0.4; transition: opacity 0.2s; padding: 4px 8px; flex-shrink: 0;
    }
    .community-delete-btn:hover { opacity: 1; }
    .community-you-block { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px dashed var(--surface2); }
    .community-section-label {
      font-family: var(--font-body); font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted);
      margin-bottom: 8px;
    }
    .community-card-you {
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft, rgba(245, 197, 24, 0.15));
      background: var(--surface);
    }
    .community-you-tag {
      font-size: 0.6rem; font-weight: 800; letter-spacing: 1px;
      padding: 2px 6px; border-radius: 6px; background: var(--accent); color: #fff;
      margin-left: 6px; vertical-align: middle; text-transform: uppercase;
    }
    .community-card-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .personal-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem; font-weight: 600;
      padding: 3px 8px; border-radius: 10px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); margin-top: 4px;
      max-width: 100%; overflow: hidden; cursor: pointer;
      transition: transform 0.1s, border-color 0.15s;
    }
    .personal-badge:hover { border-color: var(--accent); }
    .personal-badge:active { transform: scale(0.96); }
    .personal-badge-emoji { font-size: 0.85rem; line-height: 1; }
    .personal-badge-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge-modal-backdrop {
      position: fixed; inset: 0; background: var(--scrim);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.15s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .badge-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px 22px; max-width: 320px; width: 100%;
      text-align: center; position: relative;
      animation: fadeInUp 0.2s;
    }
    .badge-modal-close {
      position: absolute; top: 10px; right: 14px;
      background: none; border: none; color: var(--text-muted);
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }

      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: 1.2rem; padding: 8px 4px;
      cursor: grab; flex-shrink: 0; touch-action: none;
      user-select: none; -webkit-user-select: none;
      min-width: 28px; min-height: 44px; border-radius: 6px;
      transition: color 0.2s;
    }
    .drag-handle:hover { color: var(--text-muted); }
    .drag-handle:active { cursor: grabbing; }
    .remove-btn {
      background: none; border: none; color: var(--text-faint); cursor: pointer;
      font-size: 1rem; padding: 4px 6px; transition: color 0.2s; border-radius: 6px;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--accent); }

    /* Add from profile */
    .profile-add-btn {
      padding: 4px 10px; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: 600;
      flex-shrink: 0; transition: all 0.2s; white-space: nowrap;
    }
    .profile-add-btn:hover { background: var(--accent-hover); }
    .profile-add-btn:disabled { opacity: 0.4; cursor: default; background: var(--text-faint); }

    /* Bookmark / Watchlist buttons */
    .bookmark-btn {
      background: none; border: none; cursor: pointer; font-size: 1.1rem;
      padding: 4px 6px; transition: all 0.2s; flex-shrink: 0; border-radius: 4px;
      color: var(--text-faint); line-height: 1;
    }
    .bookmark-btn:hover { color: var(--gold); transform: scale(1.15); }
    .bookmark-btn.bookmarked { color: var(--gold); }
    .bookmark-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    /* Watchlist */
    .watchlist-section { margin-top: 10px; }
    .watchlist-empty {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
      border: 2px dashed var(--border-strong); border-radius: var(--radius);
    }
    .watchlist-empty p:first-child { font-size: 2rem; margin-bottom: 10px; }
    .watchlist-list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
    .watchlist-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 8px;
      background: transparent; border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .watchlist-item:hover { background: var(--tint); }
    .watchlist-watched-btn {
      padding: 5px 10px; background: #2e7d32; color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-weight: 600;
      flex-shrink: 0; transition: all 0.2s; white-space: nowrap;
    }
    .watchlist-watched-btn:hover { background: #388e3c; }
    .watchlist-remove-btn {
      background: none; border: none; color: var(--text-faint); cursor: pointer;
      font-size: 1rem; padding: 4px 6px; transition: color 0.2s; border-radius: 6px;
      flex-shrink: 0;
    }
    .watchlist-remove-btn:hover { color: var(--accent); }

    /* Confirm */
    .confirm-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 300;
      display: flex; align-items: center; justify-content: center;
    }
    .confirm-box {
      background: var(--surface); border: 1px solid var(--border); padding: 30px;
      border-radius: 18px; text-align: center; max-width: 350px;
    }
    .confirm-box p { margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 12px; justify-content: center; }
    .confirm-btns button {
      padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.95rem; transition: all 0.2s;
    }
    .confirm-yes { background: var(--accent); color: #fff; }
    .confirm-yes:hover { background: var(--accent-hover); }
    .confirm-no { background: var(--surface2); color: var(--text); }
    .confirm-no:hover { background: var(--border-strong); }

    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--surface); color: var(--text); padding: 12px 24px;
      border-radius: 12px; font-size: 0.9rem; z-index: 500;
      border: 1px solid var(--border); animation: fadeInUp 0.3s ease;
      box-shadow: var(--shadow-lg);
      font-family: var(--font-body);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Sign-in prompt */
    .signin-prompt {
      text-align: center; padding: 16px; background: var(--surface);
      border-radius: var(--radius); margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .signin-prompt p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 10px; }

    /* Loading spinner */
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid var(--surface2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mode Toggle */
    .mode-toggle {
      display: flex; gap: 6px; justify-content: center; margin-bottom: 12px;
    }
    .mode-btn {
      padding: 9px 20px; border: 1px solid var(--border-strong); background: none;
      color: var(--text); border-radius: 999px; cursor: pointer;
      font-family: var(--font-body); font-weight: 500; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: var(--text); background: var(--text); color: var(--bg); font-weight: 600;
    }
    .mode-btn:not(.active):hover { border-color: var(--text); }

    /* Theme toggle button */
    .theme-toggle {
      position: absolute; top: 12px; right: 12px; z-index: 150;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border-strong); background: transparent;
      color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .theme-toggle:hover { border-color: var(--text); background: var(--tint); }
    .theme-toggle svg { width: 18px; height: 18px; }

    .ranked-item:nth-child(1) .rank-number { color: var(--accent); }

    /* Profile sub-toggle for movies/tv */
    .profile-subtabs {
      display: flex; gap: 4px; justify-content: center; margin: 12px 0;
    }
    .profile-subtab {
      padding: 6px 16px; border: 1px solid var(--border-strong); background: none;
      color: var(--text-muted); border-radius: 16px; cursor: pointer;
      font-size: 0.8rem; font-weight: 600; transition: all 0.2s;
    }
    .profile-subtab.active {
      border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft);
    }

    @media (max-width: 600px) {
      .comparison-cards { gap: 10px; }
      .comparison-box { padding: 20px 14px; }
      .comparison-card-title { font-size: 0.95rem; }
      .comparison-title { font-size: 1.5rem; }
      .header h1 { font-size: 1.6rem; }
      .rec-card { width: 95px; }
      .rec-card img, .rec-card .poster-placeholder { width: 95px; height: 142px; }
      .expanded-cat-overlay { padding: 20px 8px; }
      .expanded-cat-grid { padding: 16px 12px; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); }
      .expanded-cat-header { padding: 16px; }
      .nav-tabs { gap: 2px; }
      .nav-tab { padding: 8px 10px; font-size: 0.8rem; }
      .mode-btn { padding: 6px 14px; font-size: 0.8rem; }
      .stats-cards { grid-template-columns: 1fr 1fr; }
      .ranked-item {
        flex-wrap: wrap; gap: 6px 8px; padding: 10px 10px;
      }
      .ranked-item-info { flex: 1; min-width: 120px; }
      .ranked-item-title {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        font-size: 0.85rem;
      }
      .ranked-item-year { font-size: 0.7rem; }
      .rank-number { min-width: 24px !important; font-size: 1.1rem !important; }
      .score-badge { min-width: 28px; font-size: 0.7rem; padding: 3px 4px; }
      .drag-handle { min-width: 20px; padding: 6px 2px; font-size: 1rem; }
      .remove-btn { padding: 2px 4px; font-size: 0.85rem; }
      .bookmark-btn { padding: 2px 4px; font-size: 0.9rem; }
      .profile-add-btn { padding: 3px 6px; font-size: 0.65rem; }
    }

    /* ─── Stats & Insights ─────────────────────────────────────── */
    .stats-accordion {
      margin-top: 24px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .stats-accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; cursor: pointer; user-select: none;
      transition: background 0.2s;
    }
    .stats-accordion-header:hover { background: var(--tint); }
    .stats-accordion-header h3 {
      margin: 0; font-size: 1rem; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .stats-chevron {
      font-size: 0.8rem; color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    .stats-accordion.open .stats-chevron { transform: rotate(180deg); }
    .stats-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .stats-accordion.open .stats-body { max-height: 2000px; }
    .stats-content { padding: 0 20px 20px; }
    .stats-cards {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 24px;
    }
    .stats-card {
      background: var(--tint); border-radius: 10px;
      padding: 16px; text-align: center;
    }
    .stats-card-number {
      font-size: 1.8rem; font-weight: 700; color: var(--accent);
      line-height: 1;
    }
    .stats-card-label {
      font-size: 0.75rem; color: var(--text-muted); margin-top: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .stats-section-title {
      font-family: var(--font-body);
      font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
      margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 3px;
    }
    .stats-bar-chart { margin-bottom: 24px; }
    .stats-bar-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .stats-bar-label {
      width: 80px; font-size: 0.8rem; color: var(--text-muted);
      text-align: right; flex-shrink: 0;
    }
    .stats-bar-track {
      flex: 1; height: 22px; background: var(--tint);
      border-radius: 6px; overflow: hidden; position: relative;
    }
    .stats-bar-fill {
      height: 100%; border-radius: 6px;
      background: var(--accent);
      transition: width 0.5s ease;
      min-width: 2px;
    }
    .stats-bar-count {
      font-size: 0.75rem; color: var(--text-muted); width: 30px;
      flex-shrink: 0;
    }
    .stats-insights {
      background: var(--tint); border-radius: 10px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .stats-insight {
      font-size: 0.85rem; color: var(--text);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .stats-insight-icon { flex-shrink: 0; }
    .stats-empty {
      text-align: center; padding: 30px; color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ─── Matinee component layer ───────────────────────────────── */

    /* Overlays: blurred scrim, tinted per theme */
    .comparison-overlay, .import-overlay, .movie-detail-overlay, .expanded-cat-overlay,
    .sharecard-overlay {
      background: var(--scrim);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
    }

    /* Elevation on cards/modals/panels. List rows stay flat. */
    .auth-form, .profile-banner, .community-card, .trophy-card,
    .stats-accordion, .signin-prompt {
      box-shadow: var(--shadow-sm);
    }
    .comparison-box, .movie-detail-box, .import-modal, .expanded-cat-modal, .sharecard-modal {
      box-shadow: var(--shadow-lg);
    }
    .community-card:hover, .trophy-card:hover {
      box-shadow: var(--shadow-lift);
    }

    /* Primary CTAs: solid accent, no glow */
    .auth-btn-signin,
    .auth-form-submit,
    .import-btn-primary,
    .movie-detail-rerank,
    .profile-back,
    .profile-add-btn {
      background: var(--accent); color: #fff;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
    }
    .auth-btn-signin:hover,
    .auth-form-submit:hover,
    .import-btn-primary:hover,
    .movie-detail-rerank:hover,
    .profile-back:hover,
    .profile-add-btn:not(:disabled):hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .auth-btn-signin:active,
    .auth-form-submit:active,
    .import-btn-primary:active,
    .movie-detail-rerank:active,
    .profile-back:active,
    .profile-add-btn:active {
      transform: translateY(0);
    }
    .profile-add-btn:disabled {
      background: var(--surface2); color: var(--text-muted);
      box-shadow: none;
    }

    /* Ranked list: italic serif rank numbers, #1 in the accent */
    .rank-number {
      font-variant-numeric: tabular-nums;
      font-size: 1.6rem; letter-spacing: -0.02em;
      min-width: 40px;
    }
    .ranked-item::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--accent);
      transform: scaleX(var(--score-scale, 0)); transform-origin: left;
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.2s;
      opacity: 0;
    }
    .ranked-item:hover::after { opacity: 1; }
    .ranked-list.is-dragging .ranked-item::after { display: none; }

    /* Comparison screen */
    .comparison-card {
      border-radius: 12px; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.2s;
    }
    .comparison-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }
    .comparison-card.is-losing {
      animation: loser-fade 220ms cubic-bezier(0.4,0,0.2,1) forwards;
    }
    .comparison-card.is-winning {
      animation: winner-flash 220ms cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes loser-fade {
      to { transform: scale(0.92); opacity: 0.25; }
    }
    @keyframes winner-flash {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Film-strip progress */
    .comparison-strip {
      display: flex; gap: 4px; justify-content: center;
      margin: 4px 0 2px; padding: 6px 0;
      flex-wrap: wrap; max-width: 360px; margin-left: auto; margin-right: auto;
    }
    .comparison-strip-cell {
      width: 14px; height: 18px; border-radius: 2px;
      background: var(--surface2);
      border: 1px solid var(--border-strong);
      position: relative;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .comparison-strip-cell::before,
    .comparison-strip-cell::after {
      content: ""; position: absolute; left: 50%; transform: translateX(-50%);
      width: 6px; height: 2px; border-radius: 1px;
      background: var(--sprocket);
    }
    .comparison-strip-cell::before { top: 2px; }
    .comparison-strip-cell::after  { bottom: 2px; }
    .comparison-strip-cell.filled {
      background: var(--accent);
      border-color: transparent;
    }
    .comparison-strip-cell.current {
      transform: scaleY(1.18);
      box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--accent);
    }
    .comparison-strip-text {
      font-size: 0.72rem; color: var(--text-muted);
      margin: 0 0 18px;
      letter-spacing: 1.5px; text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    /* Typography rhythm */
    .ranked-header h2 {
      font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em;
    }
    .rank-number, .score-badge, .ranked-item-year, .profile-count,
    .compatibility-badge, .activity-time, .stats-card-number,
    .stats-bar-count, .comparison-progress {
      font-variant-numeric: tabular-nums;
    }
    .eyebrow {
      display: block;
      font-family: var(--font-body); font-weight: 600;
      font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 4px;
    }
    .trophy-section-title .eyebrow { margin-bottom: 2px; }

    /* Micro-interactions */
    @keyframes bookmark-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1.1); }
    }
    .bookmark-btn.bookmarked {
      animation: bookmark-pop 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .genre-pill {
      transition: background 0.25s ease, color 0.25s ease, transform 0.12s ease;
    }
    .genre-pill:not(.active):hover { background: var(--border-strong); color: var(--text); }
    .genre-pill:active { transform: scale(0.96); }

    /* Poster skeleton shimmer — subtle ambient motion for placeholder posters */
    .poster-placeholder {
      position: relative; overflow: hidden;
    }
    .poster-placeholder::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, var(--shimmer) 50%, transparent 70%);
      animation: poster-shimmer 2.6s linear infinite;
      pointer-events: none;
    }
    @keyframes poster-shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    /* Search input: focus ring */
    .search-input:focus {
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Stats bars reveal */
    .stats-bar-fill {
      background: var(--accent);
      animation: bar-reveal 600ms cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes bar-reveal {
      from { transform: scaleX(0); transform-origin: left; }
      to   { transform: scaleX(1); transform-origin: left; }
    }
    .stats-card-number { font-family: var(--font-display); font-weight: 600; }

    /* Module 8 — gold-foil first trophy winner */
    .trophy-shelf .trophy-card:first-child .trophy-winner-name {
      background: var(--gold-foil);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      font-weight: 700;
      animation: foil-shimmer 5s linear infinite;
    }
    @keyframes foil-shimmer {
      from { background-position: 0% 50%; }
      to   { background-position: 200% 50%; }
    }

    /* Respect reduced-motion: disable decorative animations */
    @media (prefers-reduced-motion: reduce) {
      .trophy-shelf .trophy-card:first-child .trophy-winner-name,
      .poster-placeholder::after,
      .bookmark-btn.bookmarked,
      .stats-bar-fill {
        animation: none !important;
      }
      .comparison-card.is-losing, .comparison-card.is-winning {
        animation-duration: 1ms !important;
      }
    }

    /* Hover bleeds past the row box so the highlight is not cramped against the text */
    .activity-item.clickable {
      cursor: pointer; border-radius: 10px; transition: background 0.15s ease;
      padding-left: 8px; padding-right: 8px; margin-left: -8px; margin-right: -8px;
    }
    .activity-item.clickable:hover { background: var(--surface2); }
    .activity-item.clickable:active { transform: scale(0.995); }

    /* ─── Share Card ─────────────────────────────────────────────── */
    .toast { display: flex; align-items: center; gap: 14px; }
    .toast-action {
      flex-shrink: 0; background: var(--accent); color: #fff; border: none;
      padding: 6px 14px; border-radius: 999px; cursor: pointer;
      font-family: var(--font-body); font-weight: 700; font-size: 0.8rem;
    }
    .toast-action:active { transform: scale(0.96); }

    .sharecard-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; overflow-y: auto;
      animation: fadeIn 0.2s ease;
    }
    .sharecard-modal {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; width: 100%; max-width: 560px;
      max-height: calc(100vh - 48px); overflow-y: auto;
    }
    .sharecard-close {
      position: absolute; top: 12px; right: 14px; background: none; border: none;
      color: var(--text-muted); font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 4px;
    }
    .sharecard-close:hover { color: var(--text); }
    .sharecard-title {
      font-family: var(--font-display); font-size: 1.15rem; font-weight: 700;
      margin: 0 0 14px; color: var(--text);
    }
    .sharecard-formats { display: flex; gap: 8px; margin-bottom: 16px; }
    .sharecard-pill {
      background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
      padding: 7px 16px; border-radius: 999px; cursor: pointer;
      font-family: var(--font-body); font-size: 0.82rem; font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .sharecard-pill.active {
      background: var(--accent-soft); color: var(--accent-text); border-color: var(--border-accent);
    }
    .sharecard-preview {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; min-height: 320px; margin-bottom: 14px;
    }
    .sharecard-preview img { display: block; width: 100%; height: auto; max-height: 46vh; object-fit: contain; }
    .sharecard-preview.story img { max-height: 52vh; width: auto; }
    .sharecard-status {
      padding: 60px 20px; text-align: center; color: var(--text-muted);
      font-family: var(--font-body); font-size: 0.85rem;
    }
    .sharecard-note {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 0.78rem; line-height: 1.5;
      color: var(--text-muted); font-family: var(--font-body);
    }
    .sharecard-note-btn {
      background: none; border: none; color: var(--accent-text); cursor: pointer;
      font-family: inherit; font-size: inherit; font-weight: 700; padding: 0; margin-left: 6px;
      text-decoration: underline;
    }
    .sharecard-actions {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px; margin-bottom: 14px;
    }
    .sharecard-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 11px 14px; border-radius: 10px; cursor: pointer;
      font-family: var(--font-body); font-weight: 600; font-size: 0.86rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .sharecard-btn:hover:not(:disabled) { background: var(--surface); border-color: var(--border-strong); }
    .sharecard-btn:active:not(:disabled) { transform: scale(0.98); }
    .sharecard-btn:disabled { opacity: 0.45; cursor: default; }
    .sharecard-btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
    .sharecard-btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .sharecard-btn.ig {
      background: linear-gradient(135deg, #833AB4 0%, #E1306C 55%, #F77737 100%);
      border-color: transparent; color: #fff;
    }
    .sharecard-btn.ig:hover:not(:disabled) { filter: brightness(1.08); }
    .sharecard-caption {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-family: var(--font-body); font-size: 0.78rem;
      color: var(--text-muted); line-height: 1.55; white-space: pre-wrap;
    }
    .movie-detail-sharecard {
      flex: 1; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); padding: 12px; border-radius: 10px; cursor: pointer;
      font-family: var(--font-body); font-weight: 600; font-size: 0.9rem;
    }
    .movie-detail-sharecard:hover { background: var(--surface); border-color: var(--border-strong); }
    @media (max-width: 600px) {
      .sharecard-overlay { padding: 12px 8px; align-items: flex-start; }
      .sharecard-modal { padding: 18px 14px; }
      .sharecard-actions { grid-template-columns: repeat(2, 1fr); }
      .sharecard-preview img { max-height: 40vh; }
      .sharecard-preview.story img { max-height: 44vh; }
    }
  </style>
